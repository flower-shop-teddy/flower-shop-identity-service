# Cấu hình CHUNG cho mọi môi trường. KHÔNG chứa mật khẩu, KHÔNG chứa private key.
# Secret được truyền vào qua biến môi trường (UAT/PROD lấy từ Vault).
server:
  port: 8083
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: identity-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

identity:
  jwt:
    issuer: flower-shop-identity          # claim iss: service nhận token kiểm tra đúng giá trị này
    audience: flower-shop-api             # claim aud: token này dùng cho API của flower-shop
    access-token-ttl: 15m                 # ngắn: access token KHÔNG thu hồi được trước khi hết hạn
    service-token-ttl: 5m
    key-id: ${JWT_KEY_ID:}                # kid: tên khóa đang ký, ghi trong header JWT
    private-key: ${JWT_PRIVATE_KEY:}      # PEM PKCS#8 (-----BEGIN PRIVATE KEY-----)
    generate-dev-key: false               # chỉ profile local bật: tự sinh khóa khi khởi động
    retired-public-keys: {}               # kid -> PEM public key của khóa cũ, giữ trong JWKS lúc xoay khóa
  refresh-token:
    ttl: 7d
  login:
    max-failed-attempts: 5
    lock-duration: 15m
  password:
    bcrypt-strength: 12                   # mỗi +1 là chậm gấp đôi: chậm với kẻ dò mật khẩu, vẫn nhanh với người dùng
  bootstrap-admin:                        # tạo ADMIN đầu tiên nếu hệ thống chưa có ADMIN nào
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  customer-service:
    base-url: http://customer-service     # tên trên Eureka, @LoadBalanced RestClient tự tra địa chỉ
    connect-timeout: 2s
    read-timeout: 5s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{userId:-}]"
